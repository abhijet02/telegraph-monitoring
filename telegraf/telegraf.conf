[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = false
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 1
  expiration_interval = "60s"
[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.mem]]
[[inputs.swap]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "nsfs", "proc", "sysfs", "cgroup", "cgroup2"]
[[inputs.diskio]]
[[inputs.system]]
[[inputs.processes]]
# Network namespace is isolated; remote host network metrics use native exporters.
